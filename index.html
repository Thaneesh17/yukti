function toast(m){const t=$('#t');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),3600)}
function card(e,i){return `<a class="card rv" data-i="${pad(i)}" href="#/event/${e.s}" data-t="${e.t}"><div class="n">${pad(i)}<em>${e.t=='T'?'Technical':'Non-technical'}</em></div><h3>${e.n}</h3><p>${e.d.split('. ')[0].replace(/\.$/,'')}.</p><div class="ft"><span>${e.v} · from <b>₹${lo(e)}</b></span><span class="ar">→</span></div></a>`}
function home(){
const rooms={};E.forEach(e=>(rooms[e.v]=rooms[e.v]||[]).push(e));
const mq=E.map(e=>`<span>${e.n}</span>`).join('');
app.innerHTML=`<header class="hero"><i class="px" style="top:18%;left:7%"></i><i class="px" style="top:26%;left:11%;width:16px;height:16px;animation-delay:-2s;background:var(--cy)"></i><i class="px" style="top:62%;right:9%;width:34px;height:34px;animation-delay:-4s"></i><i class="px" style="top:70%;right:14%;width:14px;height:14px;animation-delay:-1s;background:var(--org)"></i><div class="blob b1"></div><div class="blob b2"></div><div class="w" style="position:relative">
<div class="pre"><i></i>Department of Information Technology presents</div>
<h1 aria-label="YUKTI"><span>Y</span><span>U</span><span>K</span><span>T</span><span>I</span></h1><div class="yr">2026</div>
<p class="tag"><b>Innovate. Research. Present.</b> Two days, ten events. Code, build, bid, guess and pull your way through MGIT's IT fest.</p>
<div class="meta"><div><small>Dates</small><strong>16 &amp; 17 October 2026</strong></div><div><small>Venue</small><strong>D-Block, MGIT</strong></div><div><small>Events</small><strong>6 technical · 4 non-technical</strong></div></div>
<a class="btn p" href="#/events">Explore events →</a> <a class="btn o" href="#/team">Meet the team</a>
<div class="cd" id="cd" aria-live="off"></div></div></header>
<div class="mq" aria-hidden="true"><div>${mq}${mq}</div></div>
<div class="w" style="padding-top:70px"><div class="st rv">${[[10,"Events"],[2,"Days"],[29,"Years of MGIT"]].map(([n,l])=>`<div><b data-n="${n}">0</b><span>${l}</span></div>`).join("")}</div></div>
<section id="events" style="padding-top:70px"><div class="w"><div class="k rv">The lineup</div><h2 class="rv">Pick your battle.</h2><p class="sub rv">Tap any event for fees, venue, rules and the coordinators to call.</p>
<div class="tabs rv"><button class="on" data-f="A">All 10</button><button data-f="T">Technical</button><button data-f="N">Non-technical</button></div>
<div class="grid" id="gr">${E.map(card).join('')}</div></div></section>
<section id="venues" style="padding-top:20px"><div class="w"><div class="k rv">Find your room</div><h2 class="rv">Where to go.</h2><p class="sub rv">All events run in D-Block on both days.</p>
<div class="rooms">${Object.keys(rooms).sort().map(r=>`<div class="rm rv"><strong>${r}</strong><ul>${rooms[r].map(e=>`<li><a href="#/event/${e.s}">${e.n}</a></li>`).join('')}</ul></div>`).join('')}</div></div></section>
<section id="team"><div class="w"><div class="k rv">The people behind it</div><h2 class="rv">Organising team.</h2><p class="sub rv">Faculty and students of the Department of IT, MGIT.</p><div class="team">
<div class="hod rv"><small>${P[0][0]}</small><h3>${P[0][1]}</h3><p>${P[0][2]}</p></div>
<div class="gh">Faculty coordinators</div>${P.slice(1,3).map(pp).join('')}
<div class="gh">Student conveners</div>${P.slice(3,5).map(pp).join('')}
<div class="gh">Student co-conveners</div>${P.slice(5).map(pp).join('')}</div></div></section>
<section id="sponsors" style="padding-top:20px"><div class="w"><div class="k rv">With thanks to</div><h2 class="rv">Our sponsors.</h2><div class="sp rv" style="margin-top:30px">${SP.map(s=>`<div>${s}</div>`).join('')}</div></div></section>`;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));document.querySelectorAll('#gr .card').forEach(c=>c.style.display=b.dataset.f=='A'||c.dataset.t==b.dataset.f?'':'none')});
cd();}
function pp(p){return `<div class="pp rv"><small>${p[0]}</small><h4>${p[1]}</h4>${p[2]?`<p>${p[2]}</p>`:''}${p[3]?`<a href="tel:+91${p[3]}">${ph(p[3])}</a>`:''}</div>`}
let ct;function cd(){clearInterval(ct);const el=$('#cd');if(!el)return;const T=new Date('2026-10-16T09:00:00+05:30');
const tick=()=>{let d=T-Date.now();if(d<=0){el.innerHTML='<div style="min-width:0;padding:14px 26px"><strong style="font-size:22px">Happening now</strong></div>';return}
const v=[[864e5,'Days'],[36e5,'Hours'],[6e4,'Mins'],[1e3,'Secs']].map(([u,l])=>{const n=Math.floor(d/u);d-=n*u;return `<div><strong>${String(n).padStart(2,'0')}</strong><small>${l}</small></div>`});el.innerHTML=v.join('')};tick();ct=setInterval(tick,1000)}
function ev(s){const i=E.findIndex(e=>e.s==s);if(i<0)return home();const e=E[i],a=E[(i+E.length-1)%E.length],b=E[(i+1)%E.length];
app.innerHTML=`<div class="ev"><div class="w"><div class="eh"><a class="bk" href="#/events">← All events</a>
<div class="pre"><i></i>${pad(i)} / 10 · ${e.t=='T'?'Technical':'Non-technical'} event</div>
<h1><span>${e.n}</span></h1><p class="d">${e.d}</p>
<div class="chips">${e.tg.map(t=>`<span>${t}</span>`).join('')}</div>${e.p?`<div class="perk">★ ${e.p}</div>`:''}${e.x?`<p style="color:var(--mut);max-width:640px">${e.x}</p>`:''}
<div class="meta" style="margin-top:26px"><div><small>Dates</small><strong>16 &amp; 17 Oct 2026</strong></div><div><small>Venue</small><strong>${e.v==='D-Block'?'D-Block, MGIT (room on the day)':e.v+', D-Block'}</strong></div>${e.tm?`<div><small>Time</small><strong>${e.tm}</strong></div>`:''}</div>
</div><div class="two"><div class="box rv"><h3>Registration fee</h3>${e.f.map(f=>`<div class="row"><span>${f[0]}</span><b>₹${f[1]}</b></div>`).join('')}<button class="btn p" id="rg" style="margin-top:20px;width:100%;justify-content:center">Register for ${e.n}</button></div>
<div class="box rv"><h3>Student coordinators</h3>${e.c.map(c=>`<div class="row"><span>${c[0]}</span><a href="tel:+91${c[1]}">${ph(c[1])}</a></div>`).join('')}</div></div>
<div class="nx"><a href="#/event/${a.s}"><small>← Previous</small><strong>${a.n}</strong></a><a href="#/event/${b.s}" style="text-align:right"><small>Next →</small><strong>${b.n}</strong></a></div>
</div></div>`;
$('#rg').onclick=()=>toast('Scan the registration QR on the official '+e.n+' poster, or call a coordinator above.');}
function go(id){const el=document.getElementById(id);if(!el)return;const y=el.getBoundingClientRect().top+scrollY-($('nav').offsetHeight+4);window.scrollTo({top:Math.max(0,y),behavior:'smooth'})}
function setup(){
const io=new IntersectionObserver(en=>en.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1});
document.querySelectorAll('.rv').forEach((el,k)=>{el.style.transitionDelay=(k%4)*70+'ms';io.observe(el)});
const fine=matchMedia('(pointer:fine)').matches;
document.querySelectorAll('.card').forEach(c=>{c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px');if(fine){const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(800px) rotateX(${-y*7}deg) rotateY(${x*9}deg)`}});c.addEventListener('pointerleave',()=>c.style.transform='')});
const io2=new IntersectionObserver(en=>en.forEach(x=>{if(!x.isIntersecting)return;io2.unobserve(x.target);const el=x.target,n=+el.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1300);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));k<1&&requestAnimationFrame(f)})(t0)}));
document.querySelectorAll('[data-n]').forEach(el=>io2.observe(el))}
function route(){
const h=location.hash,m=h.match(/^#\/event\/([\w-]+)/),sc=h.match(/^#\/(events|venues|team|sponsors)$/);
$('#mp').classList.remove('open');$('#mb').setAttribute('aria-expanded','false');
const fresh=!!m||!$('#events');
if(fresh){m?ev(m[1]):home();setup();const x=m&&E.find(e=>e.s==m[1]);document.title=(x?x.n+' · ':'')+'YUKTI 2026 · Department of IT, MGIT';window.scrollTo({top:0,behavior:'instant'})}
if(sc)setTimeout(()=>go(sc[1]),fresh?90:0);else if(!fresh)window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a&&a.getAttribute('href')===location.hash){e.preventDefault();route()}});
$('#mb').onclick=()=>{const o=$('#mp').classList.toggle('open');$('#mb').setAttribute('aria-expanded',o)};
addEventListener('hashchange',route);
addEventListener('scroll',()=>{const h=document.documentElement;$('#pg').style.width=(scrollY/Math.max(1,h.scrollHeight-innerHeight)*100)+'%'},{passive:true});
addEventListener('pointermove',e=>{const g=document.getElementById('glow').style;g.setProperty('--x',e.clientX+'px');g.setProperty('--y',e.clientY+'px')});
route();
</script></body></html>
